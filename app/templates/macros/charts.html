{% macro chart(id, fig) %}
{% if fig %}
<div class="donut-chart" id="{{ id }}"></div>
<script>
/* <![CDATA[ */
(function () {
  /* BUG-086: theme-aware Plotly renderer.
     Values mirror the light and dark blocks of static/theme.css.
     Series colours come from app/charts.py base (light tokens); this macro
     remaps them per active theme so dark mode uses the brighter tokens. */
  var PALETTES = {
    dark:  { grid: 'rgba(80,80,90,0.55)', tick: '#aeb4bb', hover_bg: '#414145', hover_border: '#50505A', hover_font: '#f4f1e9', font: '#aeb4bb',
             heatmap_low: '#3A3A3E', heatmap_mid: '#5B9CF6', heatmap_high: '#6bcfcf',
             accent: '#5B9CF6', secondary: '#5B9CF6', success: '#6bcfcf', warning: '#d39a52', purple: '#9aaabd', muted: '#aeb4bb', accent_rgb: '91, 156, 246' },
    light: { grid: 'rgba(27,38,51,0.16)', tick: '#566271', hover_bg: '#f5f1e9', hover_border: '#1b2633', hover_font: '#142235', font: '#566271',
             heatmap_low: '#f5f1e9', heatmap_mid: '#BE342B', heatmap_high: '#3d7a7a',
             accent: '#BE342B', secondary: '#60738A', success: '#3d7a7a', warning: '#A66B25', purple: '#9AAABD', muted: '#566271', accent_rgb: '190, 52, 43' }
  };

  function palette() {
    return PALETTES[document.documentElement.dataset.theme] || PALETTES.dark;
  }

  /* Maps the base (light-token) hex colours produced by app/charts.py onto the
     active theme's equivalents so every trace uses the site palette. */
  var BASE_TO_KEY = {
    '#BE342B': 'accent', '#60738A': 'secondary', '#3D7A7A': 'success',
    '#A66B25': 'warning', '#9AAABD': 'purple', '#566271': 'muted'
  };
  function seriesColor(color, p) {
    if (typeof color === 'string') {
      var k = BASE_TO_KEY[color.toUpperCase()];
      if (k && p[k]) return p[k];
    }
    return color;
  }

  function themeLayout() {
    var p = palette();
    return {
      font: { color: p.font, family: 'Inter' },
      hoverlabel: { bgcolor: p.hover_bg, bordercolor: p.hover_border, font: { color: p.hover_font } },
      xaxis: { gridcolor: p.grid, color: p.grid, tickfont: { color: p.tick, size: 13, family: 'Inter' } },
      yaxis: { gridcolor: p.grid, color: p.grid, tickfont: { color: p.tick, size: 13, family: 'Inter' } },
      legend: { font: { color: p.font } }
    };
  }

  function themeData() {
    var p = palette();
    return (figData.data || figData).map(function (trace) {
      var next = Object.assign({}, trace);
      if (next.type === 'pie') {
        next.textfont = Object.assign({}, next.textfont || {}, { color: p.font });
        if (next.marker && Array.isArray(next.marker.colors)) {
          next.marker = Object.assign({}, next.marker, {
            colors: next.marker.colors.map(function (c) { return seriesColor(c, p); })
          });
        }
      }
      if (next.type === 'heatmap') {
        next.colorscale = [[0, p.heatmap_low], [0.5, p.heatmap_mid], [1, p.heatmap_high]];
      }
      if (next.type === 'bar' && next.marker) {
        next.marker = Object.assign({}, next.marker, { color: seriesColor(next.marker.color, p) });
      }
      if (next.type === 'scatter') {
        if (next.line) {
          next.line = Object.assign({}, next.line, { color: seriesColor(next.line.color, p) });
        }
        if (next.fillcolor && typeof next.fillcolor === 'string') {
          /* Rewrite both the red accent (light base) and the blue-grey secondary
             rgb triples to the active theme's accent_rgb so the area fill adapts. */
          next.fillcolor = next.fillcolor
            .replace(/190, 52, 43/g,     p.accent_rgb)
            .replace(/96, 115, 138/g,    p.accent_rgb);
        }
      }
      return next;
    });
  }

  var el = document.getElementById('{{ id }}');
  var figData = {{ fig | tojson }};

  function render() {
    var layout = Object.assign({}, figData.layout || {}, themeLayout());
    Plotly.react(el, themeData(), layout, { responsive: true });
  }

  render();

  /* Re-render whenever the user toggles the theme (Settings page writes gsad_theme_v1). */
  window.addEventListener('storage', function (e) {
    if (e.key === 'gsad_theme_v1') { render(); }
  });
})();
/* ]]> */
</script>
{% endif %}
{% endmacro %}
