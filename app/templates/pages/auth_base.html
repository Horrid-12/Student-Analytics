<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sign In{% endblock %}</title>
<script>
  (function () {
    try {
      var t = localStorage.getItem('gsad_theme_v1');
      if (t === 'light' || t === 'dark') { document.documentElement.dataset.theme = t; }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="{{ url_for('static', path='/theme.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='/layout.css') }}">
<link rel="icon" href="{{ url_for('static', path='/favicon.ico') }}" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="{{ url_for('static', path='/Favicon.png') }}">
<style>
.auth-page{display:flex;justify-content:center;align-items:center;min-height:100vh;width:100%;padding:24px;box-sizing:border-box;}
.auth-card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:32px 28px;width:100%;max-width:420px;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.auth-card-wide{max-width:560px;}
.auth-card input.is-invalid{border-color:#fca5a5;}
.auth-card .field-error{display:none;color:#991b1b;font-size:12px;margin-top:5px;}
.auth-card h1{font-size:22px;font-weight:600;color:var(--text);margin:0 0 4px}
.auth-card p.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
.auth-card .form-group{margin-bottom:14px}
.auth-card label{display:block;font-size:13px;font-weight:500;color:var(--text);margin-bottom:5px}
.auth-card input[type="email"],.auth-card input[type="password"],.auth-card input[type="text"]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);font-size:14px;box-sizing:border-box}
.auth-card input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-active-bg)}
.auth-card .btn-primary{width:100%;padding:11px;border:none;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;background:var(--blue);color:#fff;margin-top:4px}
.auth-card .btn-primary:hover{filter:brightness(1.1)}
.auth-card .foot-text{color:var(--muted);font-size:13px;margin-top:16px;text-align:center}
.auth-card .foot-text a{color:var(--blue);text-decoration:none;font-weight:500}
.auth-card .foot-text a:hover{text-decoration:underline}
.auth-card .banner-error{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.auth-card .banner-success{background:#f0fdf4;border:1px solid #86efac;color:#166534;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.auth-card .btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text);font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;box-sizing:border-box}
.auth-card .btn-google:hover{background:var(--hover-bg,#f9fafb);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.auth-card .btn-oauth{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text);font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;box-sizing:border-box;margin-bottom:8px}
.auth-card .btn-oauth:hover{background:var(--hover-bg,#f9fafb);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.auth-card .btn-github{}
.auth-card .btn-linkedin{}
.auth-card .auth-divider{display:flex;align-items:center;margin:16px 0;text-align:center}
.auth-card .auth-divider::before,.auth-card .auth-divider::after{content:'';flex:1;border-bottom:1px solid var(--border)}
.auth-card .auth-divider span{padding:0 12px;color:var(--muted);font-size:12px;white-space:nowrap}
/* Multi-phase signup stepper (shared by all signup phases). Red accent +
   paper theme; later phases reuse .phase-steps with a higher --phase-now. */
.auth-card .phase-steps{margin:0 0 20px}
.auth-card .phase-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-red);margin-bottom:10px}
.auth-card .phase-track{display:flex;align-items:center;gap:0}
.auth-card .phase-dot{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.auth-card .phase-dot i{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:700;border:2px solid var(--border);background:var(--card-bg);color:var(--muted)}
.auth-card .phase-dot small{font-size:11px;font-weight:600;color:var(--muted)}
.auth-card .phase-dot.is-now i{border-color:var(--accent-red);background:var(--accent-red);color:#fff;box-shadow:0 0 0 4px var(--accent-red-soft-strong)}
.auth-card .phase-dot.is-now small{color:var(--accent-red)}
.auth-card .phase-dot.is-done i{border-color:var(--accent-red);background:var(--accent-red);color:#fff}
.auth-card .phase-dot.is-done small{color:var(--accent-red)}
.auth-card .phase-link{flex:1;height:2px;background:var(--border);opacity:.45;margin:0 6px 20px}
.auth-card .phase-note{font-size:12px;color:var(--muted);margin-top:10px}
.auth-card .signup-note{font-size:12px;color:var(--muted);background:var(--card-soft,rgba(0,0,0,.03));border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-top:12px}
/* Phase-3 link rows: handle box + inline Link/Pending button on the right. */
.auth-card .link-row{display:flex;gap:8px;align-items:stretch;}
.auth-card .link-row input{flex:1;min-width:0;}
.auth-card .link-row input[readonly]{opacity:.75;}
.auth-card .link-static{flex:1;min-width:0;display:flex;align-items:center;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);font-size:14px;box-sizing:border-box;}
/* Boxed link row: label/handle and the Link/Pending button share one box. */
.auth-card .link-boxed{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card-bg);box-sizing:border-box;}
.auth-card .link-boxed .link-static{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;}
.auth-card .link-btn{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:76px;padding:0 16px;border:2px solid var(--accent-red);border-radius:8px;background:transparent;color:var(--accent-red);font-weight:800;font-size:13px;font-family:Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none;transition:all 180ms ease;}
.auth-card a.link-btn:hover{background:var(--accent-red-soft);}
.auth-card .link-btn.is-pending{border-color:#a66b25;color:#a66b25;cursor:default;}
.auth-card .link-btn:disabled{cursor:not-allowed;}
/* Whole-box OAuth buttons: logo left, centered text, red accent. */
.auth-card .oauth-box-wrap{margin:0;}
.auth-card .oauth-box{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:10px 14px;border:2px solid var(--accent-red);border-radius:8px;background:transparent;color:var(--accent-red);font-weight:800;font-size:14px;font-family:Inter,system-ui,sans-serif;cursor:pointer;box-sizing:border-box;transition:all 180ms ease;}
.auth-card .oauth-box:hover{background:var(--accent-red-soft);}
.auth-card .oauth-box svg{flex:none;}
.auth-card .oauth-box .oauth-text{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.auth-card .oauth-box.is-pending{border-color:#a66b25;color:#a66b25;cursor:default;}
.auth-card .oauth-box.is-pending:hover{background:transparent;}
.auth-card .oauth-box .oauth-pending{flex:none;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
.auth-card .oauth-box:disabled{cursor:not-allowed;}
.auth-card .btn-primary:disabled{opacity:.45;cursor:not-allowed;}
/* Bottom reminder above Continue: icon + one-line text inside a box. */
.auth-card .reminder-note{display:flex;align-items:center;gap:10px;margin:4px 0 16px 0;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card-soft,rgba(0,0,0,.03));}
.auth-card .reminder-note svg{flex:none;}
.auth-card .reminder-note span{font-size:14px;font-weight:600;color:var(--text);}
/* Signup single-select dropdowns — same language as the site filters:
   pill button + panel of pill options, single pick per field. */
.auth-card .su-wrap{position:relative;}
.auth-card .su-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:42px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text);font-size:14px;cursor:pointer;box-sizing:border-box;font-family:inherit;}
.auth-card .su-btn:hover{border-color:var(--accent-red);}
.auth-card .su-btn[aria-expanded="true"]{border-color:var(--accent-red);box-shadow:0 0 0 3px var(--accent-red-soft-strong);}
.auth-card .su-btn .su-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.auth-card .su-btn.is-placeholder .su-label{color:var(--muted);}
.auth-card .su-btn svg{flex:none;color:var(--accent-red);}
.auth-card .su-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:240px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,.28);padding:6px;z-index:40;}
.auth-card .su-opt{display:block;width:100%;text-align:left;padding:9px 12px;font-size:14px;color:var(--text);background:transparent;border:0;border-radius:8px;cursor:pointer;font-family:inherit;}
.auth-card .su-opt:hover{background:var(--accent-red-soft);color:var(--accent-red);}
.auth-card .su-opt[data-active="true"]{background:var(--accent-red);color:#fff;font-weight:700;}
.auth-card .su-pills{display:flex;gap:8px;padding:6px;}
.auth-card .su-pill{min-width:42px;padding:7px 12px;font-size:14px;font-weight:700;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-family:inherit;transition:all 180ms ease;}
.auth-card .su-pill:hover{border-color:var(--accent-red);color:var(--accent-red);}
.auth-card .su-pill[data-active="true"]{background:var(--accent-red);border-color:var(--accent-red);color:#fff;}
/* Phase-4 Profile picture selector (when LinkedIn is connected) */
.auth-card .pfp-select-section{margin-bottom:20px;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--card-soft,rgba(0,0,0,.02))}
.auth-card .pfp-select-title{display:flex;flex-direction:column;gap:3px;margin-bottom:12px}
.auth-card .pfp-select-title .main-label{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-red)}
.auth-card .pfp-select-title .sub-label{font-size:12px;color:var(--muted)}
.auth-card .pfp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.auth-card .pfp-grid{grid-template-columns:1fr}}
.auth-card .pfp-card{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--border);border-radius:10px;background:var(--card-bg);cursor:pointer;transition:all 180ms ease;user-select:none;box-sizing:border-box}
.auth-card .pfp-card:hover{border-color:var(--accent-red);background:var(--accent-red-faint)}
.auth-card .pfp-card.is-active,.auth-card .pfp-card:has(input:checked){border-color:var(--accent-red);background:var(--accent-red-soft);box-shadow:0 0 0 1px var(--accent-red)}
.auth-card .pfp-card input[type="radio"]{position:absolute;opacity:0;pointer-events:none;width:0;height:0;margin:0}
.auth-card .pfp-avatar-wrap{position:relative;width:40px;height:40px;flex:none}
.auth-card .pfp-img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid var(--border);display:block}
.auth-card .pfp-fallback{width:40px;height:40px;border-radius:50%;background:var(--accent-red-soft-strong);color:var(--accent-red);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1px solid var(--border)}
.auth-card .pfp-badge{position:absolute;bottom:-2px;right:-2px;width:16px;height:16px;border-radius:50%;background:var(--card-bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.auth-card .pfp-info{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.auth-card .pfp-platform{font-size:13px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auth-card .pfp-handle{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auth-card .pfp-radio-circle{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none;transition:all 180ms ease}
.auth-card .pfp-card.is-active .pfp-radio-circle,.auth-card .pfp-card:has(input:checked) .pfp-radio-circle{border-color:var(--accent-red);background:var(--accent-red)}
.auth-card .pfp-card.is-active .pfp-radio-circle::after,.auth-card .pfp-card:has(input:checked) .pfp-radio-circle::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
</style>
</head>
<body style="background:var(--bg)">
<div class="auth-page">
  {% block auth_card %}{% endblock %}
</div>
<div style="position:fixed; bottom:0; left:0; width:100%; text-align:center; font-size:12px; color:var(--muted); padding:12px 0; letter-spacing:.02em; pointer-events:none;">Department of FY Engineering</div>
</body>
</html>
