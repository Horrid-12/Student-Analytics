{% extends "base.html" %} {% block title %}404 &mdash; Page Not Found{% endblock
%} {% block content %}
<div class="empty-state">
  <div>
    <div class="empty-illustration">
      <svg
        width="42"
        height="42"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>
    <h2>Page Not Found</h2>
    <p>
      The page you are looking for doesn't exist, was moved, or the link may be
      mistyped.
    </p>
  </div>
</div>
<a class="btn btn-primary" href="/" style="width: 100%; box-sizing: border-box"
  >Go to Overview</a
>
{% endblock %}
