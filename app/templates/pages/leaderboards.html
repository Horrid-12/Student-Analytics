{% extends "base.html" %}
{% block title %}Leaderboards — GitHub Student Analytics Platform{% endblock %}
{% block head %}
<style>
  .filter-bar {
    align-items: flex-end;
  }
  .filter-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .filter-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
  }
</style>
{% endblock %}
{% block content %}

<div class="topbar-card">
  <div class="topbar">
    <div style="display:flex; flex-direction:column; justify-content:center; min-width:0;">
      <div class="topbar-title">Leaderboards</div>
      <div class="topbar-meta" style="margin-top:3px; font-size:13px;">
        <span>{{ payload.total }} students ranked</span>
      </div>
    </div>
    <div class="topbar-actions">
      {% include "partials/bell.html" %}
    </div>
  </div>
</div>

<form class="filter-bar" method="get">
  <input type="hidden" name="roster" value="{{ roster_id }}">
  <div class="filter-field">
    <label class="filter-label" for="division-filter">Division</label>
    <select id="division-filter" class="filter-select" name="division">
      {% for value in payload.divisions %}
      <option value="{{ value }}" {% if value == division %}selected{% endif %}>{{ value }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="filter-field">
    <label class="filter-label" for="batch-filter">Batch</label>
    <select id="batch-filter" class="filter-select" name="batch">
      {% for value in payload.batches %}
      <option value="{{ value }}" {% if value == batch %}selected{% endif %}>{{ value }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="filter-field">
    <label class="filter-label" for="semester-filter">Semester</label>
    <select id="semester-filter" class="filter-select" name="semester">
      {% for value in payload.semesters %}
      <option value="{{ value }}" {% if value == semester %}selected{% endif %}>{{ value }}</option>
      {% endfor %}
    </select>
  </div>
  <button class="btn" type="submit">Apply</button>
  <a class="btn" href="/leaderboards?roster={{ roster_id }}">Clear</a>
  <span class="filter-count">{{ payload.total }} ranked</span>
</form>
{% endblock %}
