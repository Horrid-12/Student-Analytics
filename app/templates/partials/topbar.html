<div class="topbar-card">
  <div class="topbar">
    <div style="display:flex; flex-direction:column; justify-content:center; min-width:0;">
      <div class="topbar-title">{{ title }}</div>
      <div class="topbar-meta" style="margin-top:3px; font-size:13px;">
        <span>{{ topbar_date }}</span>
        <span>&bull;</span>
        <span>Last completed analysis: {{ last_analysis }}</span>
      </div>
    </div>
    {% block topbar_actions %}
    <button class="btn" type="button">Limits</button>
    {% if run_controls %}
    <button class="btn btn-primary" type="button" id="run-analysis">Run Analysis</button>
    <button class="btn" type="button" id="reset-analysis">Reset</button>
    {% endif %}
    {% endblock %}
    <div style="display:flex; align-items:center; justify-content:flex-end; gap:8px;">
      <span class="badge-purple">Faculty</span>
      <div class="faculty-avatar">FM</div>
    </div>
  </div>
</div>
