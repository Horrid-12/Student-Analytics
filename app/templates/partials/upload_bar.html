<form class="upload-bar" id="roster-form"
      hx-post="/upload" hx-target="#upload-result" hx-swap="innerHTML"
      hx-encoding="multipart/form-data" enctype="multipart/form-data">
  <label class="upload-browse" for="roster-file">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    Upload
  </label>
  <input type="file" id="roster-file" name="file" hidden
         accept=".xlsx,.xls,.csv"
         hx-trigger="change" hx-post="/upload" hx-target="#upload-result" hx-swap="innerHTML"
         hx-encoding="multipart/form-data"/>
  <span class="upload-hint">200MB per file &bull; XLSX, XLS, CSV</span>
</form>
