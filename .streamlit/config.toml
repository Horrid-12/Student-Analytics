[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false

[theme]
base = "dark"

[theme.dark]
primaryColor = "#3B82F6"
backgroundColor = "#09090B"
secondaryBackgroundColor = "#18181B"
textColor = "#FFFFFF"

[theme.dark.sidebar]
backgroundColor = "#111114"

[theme.light]
primaryColor = "#3B82F6"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"

[theme.light.sidebar]
backgroundColor = "#F1F5F9"
