# Automated heavy sync — fetches deep analytics (commits, PRs, team repos)
# for every approved student, one at a time, via the Vercel API.
#
# Schedule: every 6 hours (4×/day).
# Budget:   1000 students × ~7s × 4 runs = ~470 min/month (Pro Student = 3000).
#
# Required repository secrets:
#   APP_URL      — production Vercel URL (e.g. https://your-app.vercel.app)
#   CRON_SECRET  — must match the CRON_SECRET env var on Vercel

name: Heavy Sync

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # manual trigger from Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 150      # 1000 students × 8s = ~133 min worst case
    steps:
      - name: Fetch approved students
        id: fetch
        run: |
          RESPONSE=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/users/approved")
          
          if [ $? -ne 0 ]; then
            echo "::error::Failed to fetch approved users"
            exit 1
          fi
          
          COUNT=$(echo "$RESPONSE" | jq length)
          echo "Found $COUNT approved students"
          echo "users=$RESPONSE" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Heavy sync each student
        run: |
          USERS='${{ steps.fetch.outputs.users }}'
          TOTAL=$(echo "$USERS" | jq length)
          SUCCESS=0
          FAILED=0
          SKIPPED=0

          for i in $(seq 0 $(( TOTAL - 1 ))); do
            EMAIL=$(echo "$USERS" | jq -r ".[$i].email")
            NAME=$(echo "$USERS" | jq -r ".[$i].name // .[$i].email")
            ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$EMAIL', safe=''))")

            echo "[$((i+1))/$TOTAL] Syncing $NAME ($EMAIL)..."

            HTTP_CODE=$(curl -s -o /tmp/sync_response.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ secrets.APP_URL }}/api/sync/student/$ENCODED")

            if [ "$HTTP_CODE" = "200" ]; then
              DETAIL=$(jq -r '.detail // "ok"' /tmp/sync_response.json)
              echo "  ✓ $DETAIL"
              SUCCESS=$((SUCCESS + 1))
            elif [ "$HTTP_CODE" = "429" ]; then
              echo "  ⚠ Rate limited — stopping early"
              SKIPPED=$((TOTAL - i))
              break
            else
              DETAIL=$(jq -r '.detail // "unknown error"' /tmp/sync_response.json)
              echo "  ✗ HTTP $HTTP_CODE: $DETAIL"
              FAILED=$((FAILED + 1))
            fi

            # 1s pause between students to be gentle on rate limits
            sleep 1
          done

          echo ""
          echo "=== Sync Summary ==="
          echo "Total:   $TOTAL"
          echo "Success: $SUCCESS"
          echo "Failed:  $FAILED"
          echo "Skipped: $SKIPPED"

          if [ $FAILED -gt $((TOTAL / 2)) ]; then
            echo "::error::More than half of syncs failed ($FAILED/$TOTAL)"
            exit 1
          fi
