# Automated heavy sync — fetches deep analytics (commits, PRs, team repos)
# for every approved student, one at a time, via the Vercel API.
#
# Schedule: every 6 hours (4×/day).
# Budget:   1000 students × ~7s × 4 runs = ~470 min/month (Pro Student = 3000).
#
# Required repository secrets:
#   APP_URL      — production Vercel URL (e.g. https://your-app.vercel.app)
#   CRON_SECRET  — must match the CRON_SECRET env var on Vercel

name: Heavy Sync

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # manual trigger from Actions tab
    inputs:
      start_at:
        description: 'Resume from (number from the log, e.g. 362)'
        required: false
        default: '1'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 150      # 1000 students × 8s = ~133 min worst case
    steps:
      - name: Fetch approved students
        id: fetch
        run: |
          RESPONSE=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/users/approved")
          
          if [ $? -ne 0 ]; then
            echo "::error::Failed to fetch approved users"
            exit 1
          fi
          
          COUNT=$(echo "$RESPONSE" | jq length)
          echo "Found $COUNT approved students"
          echo "users=$RESPONSE" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Heavy sync each student
        run: |
          USERS='${{ steps.fetch.outputs.users }}'
          TOTAL=$(echo "$USERS" | jq length)
          SUCCESS=0
          FAILED=0
          SKIPPED=0

          START_INPUT="${{ github.event.inputs.start_at }}"
          START_AT=$((${START_INPUT:-1} - 1))
          
          if [ $START_AT -lt 0 ]; then START_AT=0; fi
          if [ $START_AT -ge $TOTAL ]; then START_AT=$((TOTAL - 1)); fi

          i=$START_AT
          RATE_WAITS=0
          MAX_RATE_WAITS=2
          MAX_TOTAL_WAIT=5400   # 90 min of sleeping max, keeps us under the 150-min job timeout
          TOTAL_WAITED=0

          while [ $i -lt $TOTAL ]; do
            EMAIL=$(echo "$USERS" | jq -r ".[$i].email")
            NAME=$(echo "$USERS" | jq -r ".[$i].name // .[$i].email")
            ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$EMAIL', safe=''))")

            echo "[$((i+1))/$TOTAL] Syncing $NAME ($EMAIL)..."

            HTTP_CODE=$(curl -s -o /tmp/sync_response.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ secrets.APP_URL }}/api/sync/student/$ENCODED" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              DETAIL=$(jq -r '.detail // "ok"' /tmp/sync_response.json 2>/dev/null || echo "ok")
              echo "  ✓ $DETAIL"
              SUCCESS=$((SUCCESS + 1))
              i=$((i + 1))
            elif [ "$HTTP_CODE" = "429" ]; then
              if [ "$RATE_WAITS" -ge "$MAX_RATE_WAITS" ]; then
                echo "  ⚠ Rate limited again after waiting — stopping early"
                SKIPPED=$((TOTAL - i))
                break
              fi
              RATE_WAITS=$((RATE_WAITS + 1))
              # Sleep until GitHub's reset epoch (from the response) + 15s buffer.
              # Fall back to a full hour when the epoch is missing.
              RESET_AT=$(grep -o 'reset_at=[0-9]*' /tmp/sync_response.json | head -1 | cut -d= -f2 || echo "")
              NOW=$(date +%s)
              if [ -n "$RESET_AT" ] && [ "$RESET_AT" -gt "$NOW" ]; then
                WAIT=$((RESET_AT - NOW + 15))
              else
                WAIT=3600
              fi
              if [ "$WAIT" -gt $((MAX_TOTAL_WAIT - TOTAL_WAITED)) ]; then
                WAIT=$((MAX_TOTAL_WAIT - TOTAL_WAITED))
              fi
              if [ "$WAIT" -le 0 ]; then
                echo "  ⚠ Rate limited and wait budget exhausted — stopping early"
                SKIPPED=$((TOTAL - i))
                break
              fi
              TOTAL_WAITED=$((TOTAL_WAITED + WAIT))
              echo "  ⚠ Rate limited — waiting ${WAIT}s for reset, then retrying (wait $RATE_WAITS/$MAX_RATE_WAITS)"
              sleep "$WAIT"
            else
              DETAIL=$(jq -r '.detail // "unknown error"' /tmp/sync_response.json 2>/dev/null || echo "unknown error")
              echo "  ✗ HTTP $HTTP_CODE: $DETAIL"
              FAILED=$((FAILED + 1))
              i=$((i + 1))
            fi

            # 1s pause between students to be gentle on rate limits
            sleep 1
          done

          echo ""
          echo "=== Sync Summary ==="
          echo "Total:   $TOTAL"
          echo "Success: $SUCCESS"
          echo "Failed:  $FAILED"
          echo "Skipped: $SKIPPED"

          if [ $FAILED -gt $((TOTAL / 2)) ]; then
            echo "::error::More than half of syncs failed ($FAILED/$TOTAL)"
            exit 1
          fi
